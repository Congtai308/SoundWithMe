## 4. REALTIME SOCKET.IO & PLAYBACK PROTOCOL SPECIFICATION

```typescript
// 1. Authoritative Playback State
interface PlaybackState {
  roomId: string;
  trackId: string;
  title: string;
  artist: string;
  artworkUrl: string;
  durationMs: number;
  isPlaying: boolean;
  positionMs: number;       // Vị trí chuẩn tại thời điểm serverTimestamp
  serverTimestamp: number;  // Epoch ms từ Redis
  version: number;          // Sequence counter chống race condition
  updatedBy: string;        // Host userId
}

// 2. Client Synchronized Position Calculation
function getCalculatedPosition(state: PlaybackState): number {
  if (!state.isPlaying) return state.positionMs;
  const elapsed = Date.now() - state.serverTimestamp;
  return Math.min(state.positionMs + elapsed, state.durationMs);
}

// 3. Core Realtime Socket Events
export enum SocketEvents {
  // Room
  ROOM_JOIN = "room:join",
  ROOM_LEAVE = "room:leave",
  ROOM_USER_JOINED = "room:user_joined",
  ROOM_USER_LEFT = "room:user_left",
  
  // Playback Control
  PLAYBACK_PLAY = "playback:play",
  PLAYBACK_PAUSE = "playback:pause",
  PLAYBACK_SEEK = "playback:seek",
  PLAYBACK_SYNC = "playback:sync",
  
  // Shared Queue
  QUEUE_ADD = "queue:add",
  QUEUE_REMOVE = "queue:remove",
  QUEUE_REORDER = "queue:reorder",
  QUEUE_UPDATED = "queue:updated",
  
  // Social
  CHAT_MESSAGE = "chat:message",
  REACTION_SEND = "reaction:send",
  INVITE_LISTEN_TOGETHER = "invite:listen_together"
}
```
