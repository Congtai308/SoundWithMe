<script>
    // Password visibility toggle
    const toggleBtn = document.getElementById('toggle-pwd-btn');
    const pwdInput = document.getElementById('password');

    if (toggleBtn && pwdInput) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = pwdInput.getAttribute('type') === 'password';
        pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
        toggleBtn.classList.toggle('text-purple-400');
      });
    }

    // Interactive mood chips toggle
    const vibeChips = document.querySelectorAll('.vibe-chip');
    vibeChips.forEach(chip => {
      chip.addEventListener('click', () => {
        vibeChips.forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
      });
    });

    // Interactive avatar selection
    const avatarButtons = document.querySelectorAll('.avatar-option');
    avatarButtons.forEach(avatar => {
      avatar.addEventListener('click', () => {
        avatarButtons.forEach(btn => {
          btn.classList.remove('ring-2', 'ring-cyan-400', 'shadow-glow-cyan', 'scale-105');
          btn.classList.add('ring-1', 'ring-white/10', 'opacity-70');
        });
        avatar.classList.add('ring-2', 'ring-cyan-400', 'shadow-glow-cyan', 'scale-105');
        avatar.classList.remove('ring-1', 'ring-white/10', 'opacity-70');
      });
    });
  </script>
</body></html>
