<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="swm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Icon: Two overlapping vibrating sound wave rings representing shared music connection -->
  <g transform="translate(6, 6)">
    <circle cx="24" cy="24" r="22" stroke="url(#swm-grad)" stroke-width="2.5" opacity="0.3" stroke-dasharray="4 3"/>
    <circle cx="20" cy="24" r="14" fill="#8B5CF6" fill-opacity="0.2" stroke="#8B5CF6" stroke-width="2"/>
    <circle cx="28" cy="24" r="14" fill="#06B6D4" fill-opacity="0.2" stroke="#06B6D4" stroke-width="2"/>
    <!-- Center Soundwave bars -->
    <rect x="16" y="20" width="2.5" height="8" rx="1.25" fill="#FFFFFF"/>
    <rect x="20.5" y="15" width="2.5" height="18" rx="1.25" fill="#FFFFFF"/>
    <rect x="25" y="11" width="2.5" height="26" rx="1.25" fill="#FFFFFF" filter="url(#glow)"/>
    <rect x="29.5" y="16" width="2.5" height="16" rx="1.25" fill="#FFFFFF"/>
    <rect x="34" y="21" width="2.5" height="6" rx="1.25" fill="#FFFFFF"/>
  </g>
  <!-- Wordmark -->
  <text x="64" y="37" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.03em" fill="#FFFFFF">Sound<tspan fill="url(#swm-grad)">WithMe</tspan></text>
</svg>
